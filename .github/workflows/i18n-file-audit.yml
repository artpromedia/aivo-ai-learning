name: i18n File Audit

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/src/i18n/messages/**"
      - "apps/marketing/src/i18n/messages/**"
      - "apps/mobile/i18n/**"
      - "scripts/i18n-audit.mjs"
      - ".github/workflows/i18n-file-audit.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/web/src/i18n/messages/**"
      - "apps/marketing/src/i18n/messages/**"
      - "apps/mobile/i18n/**"
      - "scripts/i18n-audit.mjs"
      - ".github/workflows/i18n-file-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Needed by .github/actions/notify-slack-on-failure for the previous-run
  # lookup.
  actions: read

jobs:
  i18n-file-audit:
    name: Locale file parity audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run i18n audit (verbose)
        id: audit
        shell: bash
        run: |
          set +e
          set -o pipefail
          node scripts/i18n-audit.mjs --verbose | tee audit.log
          AUDIT_EXIT=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          echo "exit_code=$AUDIT_EXIT" >> $GITHUB_OUTPUT

      - name: Publish report to step summary
        if: always()
        run: |
          echo "## i18n File Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hard failures = missing keys or orphan keys (build fails)." >> $GITHUB_STEP_SUMMARY
          echo "Warnings = untranslated copy left as English (build does not fail)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail on hard errors
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "::error::i18n audit found missing or orphan keys. See the report above."
          exit 1

      # Page on-call when an unattended push to main/develop (or a manual
      # dispatch) goes red. PR runs are already visible to the PR author
      # and are intentionally skipped here.
      - name: Notify Slack on failure / recovery
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-slack-on-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-status: ${{ job.status }}
          check-name: "i18n locale file audit"
          workflow-filename: i18n-file-audit.yml
          failure-reason-file: audit.log
          target: "apps/{web,marketing,mobile} locale messages"
