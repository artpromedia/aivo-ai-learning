name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build-node:
    name: Build All Node Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and services
        run: pnpm build

  build-python:
    name: Validate Python Services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate brain-svc
        run: |
          pip install -r services/brain-svc/requirements.txt
          cd services/brain-svc && python -m py_compile src/brain_svc/main.py

      - name: Validate ai-svc
        run: |
          if [ -f services/ai-svc/requirements.txt ]; then
            pip install -r services/ai-svc/requirements.txt
          fi
          if [ -f services/ai-svc/src/main.py ]; then
            cd services/ai-svc && python -m py_compile src/main.py
          fi

  deploy:
    name: Deploy to Staging
    runs-on: [self-hosted, hetzner, production]
    timeout-minutes: 20
    needs: [build-node, build-python]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Verify cluster reachable
        run: |
          kubectl cluster-info
          kubectl get nodes
          echo "Cluster is reachable"

      - name: Setup Helm
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm version

      - name: Deploy via Helm
        run: |
          helm upgrade --install aivo-learning-saas-staging infra/helm \
            -f infra/helm/values/hetzner.yaml \
            -n aivo-staging --create-namespace \
            --timeout 10m \
            --wait

      - name: Verify rollout
        run: |
          kubectl -n aivo-staging get pods --sort-by=.metadata.name -o wide
          echo ""
          echo "═══ Staging deployment complete ═══"
