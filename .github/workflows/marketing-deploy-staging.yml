name: Marketing Deploy Staging

on:
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
  workflow_dispatch:

concurrency:
  group: marketing-deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    name: Build & Deploy Marketing (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @aivo/web build

      - name: Deploy to staging
        run: echo "Add staging deployment steps for your hosting provider"
