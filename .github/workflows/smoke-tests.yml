name: Post-Deploy Smoke Tests

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or production)"
        required: true
        type: string
      version:
        description: "Deployed version"
        required: false
        type: string
        default: "unknown"

jobs:
  smoke:
    name: "Smoke Tests (${{ inputs.environment }})"
    runs-on: [self-hosted, hetzner, production]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          # Prefer explicit kubeconfig when provided; otherwise use runner's
          # existing cluster context.
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
          fi

      - name: Verify cluster reachable
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Wait for stabilization (30s)
        run: sleep 30

      - name: Run health checks
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            NS="aivo-staging"
          else
            NS="aivo"
          fi

          # Services that should warn but not fail staging smoke.
          NON_BLOCKING_SERVICES=""
          if [ "${{ inputs.environment }}" = "staging" ]; then
            NON_BLOCKING_SERVICES="comms-svc"
          fi

          echo "=== Post-Deploy Smoke Tests ==="
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"
          echo "Namespace: $NS"
          echo ""

          SERVICES=(
            identity-svc billing-svc family-svc integrations-svc admin-svc
            learning-svc engagement-svc comms-svc i18n-svc tutor-svc
            status-page-svc research-svc assessment-svc
            ai-svc brain-svc web marketing
          )

          FAIL=0
          for svc in "${SERVICES[@]}"; do
            DESIRED=$(kubectl get deploy -n "$NS" "$svc" -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
            UPDATED=$(kubectl get deploy -n "$NS" "$svc" -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || true)
            AVAILABLE=$(kubectl get deploy -n "$NS" "$svc" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)

            DESIRED=${DESIRED:-0}
            UPDATED=${UPDATED:-0}
            AVAILABLE=${AVAILABLE:-0}

            STATUS="OK"
            BLOCKING=1
            if echo " $NON_BLOCKING_SERVICES " | grep -q " $svc "; then
              BLOCKING=0
            fi

            if [ "$DESIRED" -eq 0 ]; then
              STATUS="SKIPPED"
            elif [ "$UPDATED" -lt "$DESIRED" ] || [ "$AVAILABLE" -lt 1 ]; then
              STATUS="UNAVAILABLE"
              if [ "$BLOCKING" -eq 1 ]; then
                FAIL=1
              fi
            fi

            MODE="blocking"
            if [ "$BLOCKING" -eq 0 ]; then
              MODE="non-blocking"
            fi

            printf "%-25s desired=%s updated=%s available=%s [%s|%s]\n" \
              "$svc" "$DESIRED" "$UPDATED" "$AVAILABLE" "$STATUS" "$MODE"
          done

          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Smoke tests FAILED — one or more services unhealthy"
            exit 1
          fi
          echo "All services healthy"

      - name: Verify critical endpoints via port-forward
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            NS="aivo-staging"
          else
            NS="aivo"
          fi

          kubectl port-forward -n "$NS" svc/identity-svc 13001:3000 &
          PF_PID=$!
          sleep 5

          FAIL=0

          check() {
            local name="$1" url="$2" expected="$3"
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "000")
            if [ "$STATUS" = "$expected" ]; then
              echo "OK: $name → HTTP $STATUS"
            else
              echo "FAIL: $name → HTTP $STATUS (expected $expected)"
              FAIL=1
            fi
          }

          check "health" "http://localhost:13001/health" "200"
          check "csrf"   "http://localhost:13001/csrf-token" "200"

          kill $PF_PID 2>/dev/null || true

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Endpoint smoke tests failed"
            exit 1
          fi
          echo "All endpoint checks passed"

      - name: Summary
        if: always()
        run: |
          echo "## Smoke Tests — ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
