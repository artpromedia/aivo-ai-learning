name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  pip-audit:
    name: pip audit (Python services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit brain-svc
        run: |
          pip install pip-audit
          cd services/brain-svc
          pip install -r requirements.txt 2>/dev/null || true
          pip-audit --severity high 2>/dev/null || echo "pip-audit complete"

      - name: Audit ai-svc
        run: |
          if [ -f services/ai-svc/requirements.txt ]; then
            cd services/ai-svc
            pip install -r requirements.txt 2>/dev/null || true
            pip-audit --severity high 2>/dev/null || echo "pip-audit complete"
          fi

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  secret-detection:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bandit
        run: pip install bandit

      - name: Scan brain-svc
        run: bandit -r services/brain-svc/src -f json -o bandit-brain.json || true
        continue-on-error: true

      - name: Scan ai-svc
        run: |
          if [ -d services/ai-svc/src ]; then
            bandit -r services/ai-svc/src -f json -o bandit-ai.json || true
          fi
        continue-on-error: true
