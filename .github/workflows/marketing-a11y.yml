name: Marketing Accessibility Audit

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/brand/**"
      - "packages/ui/**"

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @aivo/web build

      - name: Run accessibility audit
        run: |
          npx lighthouse-ci autorun --collect.url="http://localhost:3000" || true
        continue-on-error: true
