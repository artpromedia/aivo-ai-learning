name: Notify Slack on failure (with recovery)
description: |
  Reusable "fail loudly in Slack, stay quiet on success, announce first
  recovery" notifier for unattended scheduled / push-triggered GitHub Actions
  checks. Modeled on the original implementation in
  .github/workflows/marketing-smoke-test.yml so the on-call human gets a
  real-time alert when an unattended check goes red — and a single
  :white_check_mark: when it goes green again — without alarm fatigue from
  steady-state successes.

  Behavior:
    - check-status == 'failure'  -> POST :rotating_light: alert to Slack
    - check-status == 'success' AND previous health-determining run of the
      same workflow was 'failure'  -> POST :white_check_mark: recovery notice
    - otherwise (steady-state green, skipped, cancelled)  -> stay silent

  The previous-run lookup uses `gh run list` and intentionally excludes
  pull_request events from the health signal: PR failures are already
  visible on the PR itself and are not "unattended", so they should not
  influence whether a push/scheduled run counts as a recovery.

  The `gh run list` step has `continue-on-error: true` so a transient
  GitHub API blip can't turn a healthy run into a false outage page —
  the failure-notify step is gated on `check-status`, not on the lookup.

  Required calling-workflow setup:
    permissions:
      contents: read
      actions: read   # needed for the previous-run lookup

inputs:
  slack-webhook-url:
    description: |
      Slack incoming-webhook URL (typically `${{ secrets.SLACK_WEBHOOK_URL }}`).
      If empty, the action logs and exits 0 without posting — same graceful
      degradation as marketing-smoke-test.yml.
    required: true
  check-status:
    description: |
      Outcome of the check this notifier is reporting on. Pass either
      `${{ job.status }}` or a specific `steps.<id>.outcome`. Recognized
      values: `success`, `failure`. Other values (`cancelled`, `skipped`)
      are treated as "do nothing".
    required: true
  check-name:
    description: |
      Human-readable name of the check, used in the Slack message text
      (e.g. "DB schema drift check", "Backup restore verification").
    required: true
  workflow-filename:
    description: |
      The bare filename of the calling workflow (e.g. `db-schema-drift.yml`).
      Passed to `gh run list --workflow` so the recovery lookup only inspects
      previous runs of THIS workflow.
    required: true
  github-token:
    description: |
      Token with `actions: read` on this repo, typically
      `${{ secrets.GITHUB_TOKEN }}`. Used by the previous-run lookup.
    required: true
  failure-reason-file:
    description: |
      Optional path to a text file whose last 30 lines will be included in
      the Slack failure message as the "Failure reason" field. Useful for
      surfacing the tail of a script's stdout/stderr (HTTP code, missing
      keys, etc.) so the on-call human gets the cause without clicking
      through to the Actions UI.
    required: false
    default: ""
  target:
    description: |
      Optional short label describing what was being checked (URL,
      environment, table name, etc.). Surfaced as the "Target" field in
      both failure and recovery messages.
    required: false
    default: ""
  prev-lookup-limit:
    description: |
      How many recent completed runs of this workflow to scan when
      deciding whether the current success is a recovery from an earlier
      failure. Defaults to 100 — enough to cover several weeks of
      push-triggered runs even on a busy repo. If a sustained outage
      lasts longer than this many qualifying runs, the recovery ping for
      the eventual fix may be missed (the failure pings during the
      outage are unaffected). For very chatty workflows (every-push
      guardrails), bump this; for monthly/weekly schedules, the default
      is generous.
    required: false
    default: "100"

runs:
  using: composite
  steps:
    - name: Look up previous run conclusion
      id: prev
      if: inputs.check-status == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ inputs.workflow-filename }}
        RUN_ID: ${{ github.run_id }}
        LOOKUP_LIMIT: ${{ inputs.prev-lookup-limit }}
      run: |
        set -euo pipefail
        # Find the previous run that actually exercised this check —
        # i.e., concluded `success` or `failure` AND was triggered by an
        # event that would have notified Slack. We exclude `pull_request`
        # so a green PR run between a red push and a green push doesn't
        # silence the recovery ping (PR runs never notify, so they must
        # not affect the recovery signal either). `skipped` / `cancelled`
        # are also excluded so an upstream-skipped run doesn't masquerade
        # as a healthy state.
        PREV=$(gh run list \
          --workflow "${WORKFLOW}" \
          --status completed \
          --limit "${LOOKUP_LIMIT}" \
          --repo "${REPO}" \
          --json databaseId,conclusion,event \
          --jq "map(select(.databaseId != ${RUN_ID} and .event != \"pull_request\" and (.conclusion == \"success\" or .conclusion == \"failure\"))) | .[0].conclusion // \"\"")
        echo "Previous health-determining run conclusion: '${PREV}'"
        echo "conclusion=${PREV}" >> "$GITHUB_OUTPUT"

    - name: Notify Slack on failure
      if: inputs.check-status == 'failure'
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        CHECK_NAME: ${{ inputs.check-name }}
        TARGET: ${{ inputs.target }}
        EVENT_NAME: ${{ github.event_name }}
        REASON_FILE: ${{ inputs.failure-reason-file }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
          echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
          exit 0
        fi
        # Capture the tail of the failure-reason file (if provided + present)
        # so the on-call human gets the cause directly in Slack. Falls back
        # to a clear "no detail captured" message rather than a misleading
        # blank field if the step that was supposed to write the file never
        # ran (e.g. setup failed before the script).
        if [ -n "${REASON_FILE}" ] && [ -f "${REASON_FILE}" ]; then
          REASON_RAW="$(tail -n 30 "${REASON_FILE}")"
        else
          REASON_RAW="(no failure detail captured — see GitHub Actions run for full logs)"
        fi
        # Build the JSON payload in Python so all string fields are
        # properly escaped (newlines, quotes, backticks in command output).
        # Doing this with shell heredocs leads to broken JSON the moment
        # a script prints a `"` or a backslash.
        export REASON_RAW
        PAYLOAD=$(python3 - <<'PY'
        import json, os
        fields = []
        target = os.environ.get("TARGET", "").strip()
        if target:
            fields.append({"title": "Target", "value": target, "short": True})
        fields.append({"title": "Trigger", "value": os.environ["EVENT_NAME"], "short": True})
        fields.append({
            "title": "Failure reason",
            "value": os.environ["REASON_RAW"],
            "short": False,
        })
        fields.append({
            "title": "Run",
            "value": f"<{os.environ['GITHUB_RUN_URL']}|View in GitHub Actions>",
            "short": False,
        })
        payload = {
            "text": f":rotating_light: {os.environ['CHECK_NAME']} FAILED",
            "attachments": [{"color": "danger", "fields": fields}],
        }
        print(json.dumps(payload))
        PY
        )
        curl -sS -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          --data "$PAYLOAD" \
          --retry 3 --retry-delay 2 --max-time 15 || \
          echo "Slack POST failed (non-fatal)"

    - name: Notify Slack on recovery
      # Only fire when:
      #   (a) this run's check itself succeeded, AND
      #   (b) the previous notify-eligible run was a failure.
      # If the prev-lookup step itself errored, `steps.prev.outputs.conclusion`
      # is empty and this comparison is false — we'd rather skip a recovery
      # ping than send a noisy one based on bad data.
      if: inputs.check-status == 'success' && steps.prev.outputs.conclusion == 'failure'
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        CHECK_NAME: ${{ inputs.check-name }}
        TARGET: ${{ inputs.target }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
          echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
          exit 0
        fi
        PAYLOAD=$(python3 - <<'PY'
        import json, os
        fields = []
        target = os.environ.get("TARGET", "").strip()
        if target:
            fields.append({"title": "Target", "value": target, "short": True})
        fields.append({
            "title": "Run",
            "value": f"<{os.environ['GITHUB_RUN_URL']}|View in GitHub Actions>",
            "short": False,
        })
        payload = {
            "text": f":white_check_mark: {os.environ['CHECK_NAME']} RECOVERED",
            "attachments": [{"color": "good", "fields": fields}],
        }
        print(json.dumps(payload))
        PY
        )
        curl -sS -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          --data "$PAYLOAD" \
          --retry 3 --retry-delay 2 --max-time 15 || \
          echo "Slack POST failed (non-fatal)"
